<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <script>
      (function(){
        try {
          var key="evolv-theme-preference";
          var media=window.matchMedia("(prefers-color-scheme: dark)");
          function apply(){
            var preference=localStorage.getItem(key)||"system";
            if(["system","light","dark"].indexOf(preference)===-1)preference="system";
            var resolved=preference==="system"?(media.matches?"dark":"light"):preference;
            document.documentElement.dataset.theme=resolved;
            document.documentElement.dataset.themePreference=preference;
          }
          apply();
          if(media.addEventListener)media.addEventListener("change",function(){if((localStorage.getItem(key)||"system")==="system")apply()});
          else if(media.addListener)media.addListener(function(){if((localStorage.getItem(key)||"system")==="system")apply()});
          window.addEventListener("storage",function(event){if(event.key===key)apply()});
        } catch(error) { document.documentElement.dataset.theme="dark"; }
      })();
    </script>
    <meta name="description" content="Evolv is your AI-powered productivity and personal growth companion. Build better routines, plan your day, track goals, and understand your progress." />
